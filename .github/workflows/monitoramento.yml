name: Monitoramento Diário Oficial do Acre

on:
  schedule:
    - cron: "30 13 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-diario-oficial
  cancel-in-progress: false

jobs:

  monitorar:

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Instalar dependências do OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-por

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes
        run: pytest -q

      - name: Executar monitoramento
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          NOMES_PESQUISADOS: ${{ vars.NOMES_PESQUISADOS }}
          PDF_URL: ${{ vars.PDF_URL }}

          HISTORY_FILE: state/history.json

          OCR_ENABLED: "true"
          OCR_LANGUAGE: "por"

        run: python -m src.main

      - name: Persistir histórico de notificações
        if: success()

        run: |

          if ! git diff --quiet -- state/history.json; then

            git config user.name "github-actions[bot]"

            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git add state/history.json

            git commit -m \
              "chore: atualizar histórico de notificações [skip ci]"

            git push

          else

            echo "Histórico sem alterações."

          fi
